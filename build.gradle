plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Better Combat, Combat Roll and their libraries (9.6.2 of the design doc).
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "maven.modrinth:better-combat:${project.better_combat_version}"
    modImplementation "maven.modrinth:combat-roll:${project.combat_roll_version}"
    modImplementation "maven.modrinth:playeranimator:${project.playeranimator_version}"
    modImplementation "maven.modrinth:cloth-config:${project.cloth_config_version}"
    // Better Combat ships this inside its jar; the dev run doesn't unpack nested jars, so it needs it directly.
    modLocalRuntime "maven.modrinth:tiny-config:3.1.0-fabric"
    // Serene Seasons (design doc 17.10) is required; SeanCraft reads its calendar by reflection.
    modLocalRuntime "maven.modrinth:serene-seasons:q34wStJM"
    modLocalRuntime "maven.modrinth:glitchcore:sux8kYHe"
    // YAGM graves (2.2): SeanCraft sets its options and registers a placement handler. Required, with OctoLib and Architectury.
    modImplementation "maven.modrinth:yagm:bxcvn4H5"
    modImplementation "maven.modrinth:shatterbyte-lib:z3vMP4KZ"
    modImplementation "maven.modrinth:architectury-api:Pzc2FP5K"
    // GlitchCore's nested libraries, which the dev run doesn't unpack.
    localRuntime "net.jodah:typetools:0.6.3"
    // OctoLib (YAGM's library) nests snakeyaml; the dev runtime does not load nested jars.
    localRuntime "org.yaml:snakeyaml:2.2"
    localRuntime "com.electronwill.night-config:core:3.6.7"
    localRuntime "com.electronwill.night-config:toml:3.6.7"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
    // Custom icons: drop a 16x16 PNG at assets/seancraft/textures/item/<item id>.png and that item's model uses it
    // in the built jar, in place of the stand-in vanilla texture. See ICONS.md.
    def itemTextures = file('src/main/resources/assets/seancraft/textures/item')
    filesMatching('assets/seancraft/models/item/*.json') { details ->
        def name = details.name.replace('.json', '')
        if (new File(itemTextures, name + '.png').exists()) {
            // Weapons keep their handheld pose; everything else is a flat item.
            def parent = details.file.text.contains('handheld') ? 'minecraft:item/handheld' : 'minecraft:item/generated'
            def first = true
            details.filter { line ->
                def out = first ? "{\"parent\": \"${parent}\", \"textures\": {\"layer0\": \"seancraft:item/${name}\"}}" : ''
                first = false
                return out
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
